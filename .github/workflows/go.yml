name: Go
on:
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - '**.go'
      - 'go.mod'
      - '.golangci.yml'
      - '.github/workflows/go.yml'
  # Pull requests have no "paths" filter on purpose. A workflow skipped by one
  # never reports its checks, which blocks merging when they are required. The
  # "changes" job decides whether the other jobs have work to do instead.
  pull_request:
env:
  GOPROXY: "https://proxy.golang.org"

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
    steps:
      - name: Detect changes to Go code
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename, .previous_filename // empty')
          if grep -qE '\.go$|^go\.mod$|^\.golangci\.yml$|^\.github/workflows/go\.yml$' <<<"$files"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    permissions:
      contents: read       # for actions/checkout to fetch code
      pull-requests: read  # for golangci/golangci-lint-action to fetch pull requests
    name: Lint
    needs: changes
    # Runs unless the pull request is known to have nothing for this job, which
    # includes pushes and failed detection. A skipped job satisfies a required check.
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.27.x
      - name: Check Go module tidiness and generated files
        shell: bash
        run: |
          go mod tidy
          go generate ./...
          STATUS=$(git status --porcelain)
          if [ ! -z "$STATUS" ]; then
            echo "Unstaged files:"
            echo $STATUS
            echo "Run 'go mod tidy' or 'go generate ./...' and commit them"
            exit 1
          fi
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: latest
          args: --timeout=30m

  # The jobs with a matrix skip their steps instead of the whole job. A skipped
  # matrix job reports a single check without the matrix values in its name,
  # e.g., "Test" instead of "Test (1.27.x, ubuntu-latest)", which leaves a
  # required check pending. They also run when detection fails or is skipped.
  test:
    name: Test
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      matrix:
        go-version: [ 1.27.x ]
        platform: ${{ github.ref == 'refs/heads/main' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out code
        if: ${{ needs.changes.outputs.skip != 'true' }}
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Install Go
        if: ${{ needs.changes.outputs.skip != 'true' }}
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run tests with coverage
        if: ${{ needs.changes.outputs.skip != 'true' }}
        run: go test -shuffle=on -v -race -coverprofile=coverage -covermode=atomic -json ./... > test-report.json
      - name: Show test report
        if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
        run: |
          go install github.com/mfridman/tparse@latest
          tparse -all -file=test-report.json
      - name: Send email on failure
        uses: unknwon/send-email-on-failure@89339a1bc93f4ad1d30f3b7e4911fcba985c9adb # v1
        if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          smtp_username: ${{ secrets.SMTP_USERNAME }}
          smtp_password: ${{ secrets.SMTP_PASSWORD }}

  # Running tests with race detection consumes too much memory on Windows,
  # see https://github.com/golang/go/issues/46099 for details.
  test-windows:
    name: Test Windows
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      matrix:
        go-version: [ 1.27.x ]
        platform: [ windows-latest ]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out code
        if: ${{ needs.changes.outputs.skip != 'true' }}
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Install Go
        if: ${{ needs.changes.outputs.skip != 'true' }}
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run tests with coverage
        if: ${{ needs.changes.outputs.skip != 'true' }}
        run: go test -shuffle=on -v -coverprofile=coverage -covermode=atomic ./...
      - name: Send email on failure
        uses: unknwon/send-email-on-failure@89339a1bc93f4ad1d30f3b7e4911fcba985c9adb # v1
        if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          smtp_username: ${{ secrets.SMTP_USERNAME }}
          smtp_password: ${{ secrets.SMTP_PASSWORD }}

  postgres:
    name: Postgres
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      matrix:
        go-version: [ 1.27.x ]
        platform: [ ubuntu-latest ]
    runs-on: ${{ matrix.platform }}
    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Check out code
        if: ${{ needs.changes.outputs.skip != 'true' }}
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Install Go
        if: ${{ needs.changes.outputs.skip != 'true' }}
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run tests with coverage
        if: ${{ needs.changes.outputs.skip != 'true' }}
        run: go test -shuffle=on -v -race -coverprofile=coverage -covermode=atomic -json ./internal/database/... > test-report.json
        env:
          GOGS_DATABASE_TYPE: postgres
          PGPORT: 5432
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGSSLMODE: disable
      - name: Show test report
        if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
        run: |
          go install github.com/mfridman/tparse@latest
          tparse -all -file=test-report.json

  mysql:
    name: MySQL
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      matrix:
        go-version: [ 1.27.x ]
        platform: [ ubuntu-22.04 ] # Use the lowest version possible for backwards compatibility.
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Start MySQL server
        if: ${{ needs.changes.outputs.skip != 'true' }}
        run: sudo systemctl start mysql
      - name: Check out code
        if: ${{ needs.changes.outputs.skip != 'true' }}
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Install Go
        if: ${{ needs.changes.outputs.skip != 'true' }}
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run tests with coverage
        if: ${{ needs.changes.outputs.skip != 'true' }}
        run: go test -shuffle=on -v -race -coverprofile=coverage -covermode=atomic -json ./internal/database/... > test-report.json
        env:
          GOGS_DATABASE_TYPE: mysql
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
      - name: Show test report
        if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
        run: |
          go install github.com/mfridman/tparse@latest
          tparse -all -file=test-report.json
