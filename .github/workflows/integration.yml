name: Integration
on:
  push:
    branches:
      - main
      - 'release/**'
  # Pull requests have no "paths" filter on purpose. A workflow skipped by one
  # never reports its checks, which blocks merging when they are required. The
  # "changes" job decides whether the other jobs have work to do instead.
  pull_request:
env:
  GOPROXY: "https://proxy.golang.org"

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
    steps:
      - name: Detect changes outside documentation
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename, .previous_filename // empty')
          # Files under conf/, templates/ and public/ are embedded into the binary, Markdown included.
          if grep -qvE '^docs/|\.md$' <<<"$files" || grep -qE '^(conf|templates|public)/' <<<"$files"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test
    needs: changes
    # Runs unless the pull request is known to have nothing for this job, which
    # includes pushes and failed detection. A skipped job satisfies a required check.
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Check out code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.27.x
      - name: Run integration tests
        run: go test -count=1 -shuffle=on -v ./integration-tests/...
        env:
          GOGS_INTEGRATION_TEST: 1
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGSSLMODE: disable

  browser:
    name: Browser tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    env:
      MOON_COLOR: "true"
      FORCE_COLOR: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.27.x
      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Set up moon
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: false
      - name: Build Gogs with the web app
        run: moon run gogs:build-prod
      - name: Install browsers
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run browser tests
        working-directory: web
        run: pnpm run e2e
      - name: Upload traces of failed tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-traces
          path: web/e2e/results
          retention-days: 7
