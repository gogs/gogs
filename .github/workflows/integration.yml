name: Integration
on:
  push:
    branches:
      - main
      - 'release/**'
  # Pull requests have no "paths" filter on purpose. A workflow skipped by one
  # never reports its checks, which blocks merging when they are required. The
  # "changes" job decides whether the other jobs have work to do instead.
  pull_request:
env:
  GOPROXY: "https://proxy.golang.org"

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
    steps:
      - name: Detect changes outside documentation
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename, .previous_filename // empty')
          # Files under conf/, templates/ and public/ are embedded into the binary, Markdown included.
          if grep -qvE '^docs/|\.md$' <<<"$files" || grep -qE '^(conf|templates|public)/' <<<"$files"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test
    needs: changes
    # Runs unless the pull request is known to have nothing for this job, which
    # includes pushes and failed detection. A skipped job satisfies a required check.
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      openldap:
        image: osixia/openldap:1.5.0
        env:
          LDAP_ORGANISATION: Gogs
          LDAP_DOMAIN: example.org
          LDAP_ADMIN_PASSWORD: admin
        # slapd of this image sizes its tables by the limit of open files, and
        # hangs at startup under the much higher default of recent Docker.
        options: >-
          --ulimit nofile=1024:1024
          --health-cmd "ldapsearch -x -H ldap://localhost -b dc=example,dc=org -D cn=admin,dc=example,dc=org -w admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 389:389
    steps:
      - name: Check out code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.27.x
      # SMTP sign-in tests serve implicit TLS on port 465, the only port Gogs
      # uses implicit TLS for.
      - name: Allow listening on port 465
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=465
      - name: Run integration tests
        run: go test -count=1 -shuffle=on -v ./integration-tests/...
        env:
          GOGS_INTEGRATION_TEST: 1
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGSSLMODE: disable
          LDAP_HOST: localhost
          LDAP_PORT: 389
          LDAP_BASE_DN: dc=example,dc=org
          LDAP_ADMIN_DN: cn=admin,dc=example,dc=org
          LDAP_ADMIN_PASSWORD: admin
