name: Web
on:
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'web/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/web.yml'
  # Pull requests have no "paths" filter on purpose. A workflow skipped by one
  # never reports its checks, which blocks merging when they are required. The
  # "changes" job decides whether the other jobs have work to do instead.
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
    steps:
      - name: Detect changes to the web app
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename, .previous_filename // empty')
          if grep -qE '^web/|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^package\.json$|^\.github/workflows/web\.yml$' <<<"$files"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  web:
    name: Lint and build
    needs: changes
    # Runs unless the pull request is known to have nothing for this job, which
    # includes pushes and failed detection. A skipped job satisfies a required check.
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    env:
      MOON_COLOR: "true"
      FORCE_COLOR: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Set up moon
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: false
      - name: Lint
        run: moon run web:lint
      - name: Build
        run: moon run web:build
      - name: Check for uncommitted changes
        run: git diff --exit-code --stat
