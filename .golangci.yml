version: "2"
linters:
  enable:
    - nakedret
    - rowserrcheck
    - unconvert
    - unparam
  settings:
    govet:
      disable:
        # printf reports "non-constant format string" for calls such as fmt.Errorf(msg).
        - printf
    staticcheck:
      checks:
        - all
        - "-SA1019" # This project is under active refactoring and not all code is up to date.
        - "-QF1001" # Applying De Morgan's law does not always make a condition easier to read.
        - "-ST1016" # Some code uses different receiver names for methods of the same type.
    nakedret:
      max-func-lines: 0 # Disallow naked returns in functions of any length.
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      # Derived from github.com/glebarez/sqlite, kept close to upstream.
      - internal/sqlite/(ddlmod|dialector|migrator)\.go$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
